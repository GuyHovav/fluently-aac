ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'

    // Pins the Kotlin Gradle plugin version used by app/build.gradle (for the custom
    // FluentlyTts/AppLauncher plugins) so it matches what the Capacitor community
    // plugins (camera/geolocation) already default to.
    kotlin_version = '2.2.20'

    // Required for @capacitor-firebase/authentication's Google Sign-In path (native SDK,
    // avoids the "disallowed_useragent" WebView OAuth block). Without this flag the
    // plugin's Android module only compileOnly-includes play-services-auth/credentials/
    // googleid, so Google Sign-In would fail at runtime with a ClassNotFoundException.
    rgcfaIncludeGoogle = true
}